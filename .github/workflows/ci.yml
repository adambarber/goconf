name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test -count=1 ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          args: --timeout=5m
      - run: golangci-lint fmt --diff
